name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          # Many OFD users are on Windows; catch path and encoding problems early.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Get the shared test files
        uses: actions/checkout@v5
        with:
          repository: Edgar-311/ofd-samples
          path: ofd-samples
      - name: Install
        run: python -m pip install .
      - name: Test
        shell: bash
        env:
          OFD_SAMPLES_DIR: ofd-samples
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Show failures on the summary page
        if: failure()
        run: python .github/scripts/annotate_failures.py test-output.txt

  # The MCP server and MarkItDown plugin need optional dependencies; test them too.
  extras:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with extras
        # openpyxl only checks that the Excel files ofdkit writes read back.
        run: python -m pip install ".[mcp,markitdown]" openpyxl
      - name: Test
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Show failures on the summary page
        if: failure()
        run: python .github/scripts/annotate_failures.py test-output.txt
